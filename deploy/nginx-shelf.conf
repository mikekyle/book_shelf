# nginx: serve the built SPA and proxy book_core API on the same origin.
# Used by the Oracle live deploy on host port 8003.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy read API + docs/health to the book_core container/host port.
    location /api/ {
        proxy_pass http://host.docker.internal:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://host.docker.internal:8002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://host.docker.internal:8002/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://host.docker.internal:8002/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
