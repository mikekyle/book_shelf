# Same-origin shelf front door on the Oracle VM (port 8003).
# Proxies /api, /health, /docs to book_core on the host's port 8002.
services:
  shelf:
    image: nginx:1.27-alpine
    ports:
      - "8003:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx-shelf.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
