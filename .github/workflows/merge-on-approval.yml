# Pipeline gates that must not depend on Cursor seeing bot events.
#
# 1. request-fix — when the Reviewer (cursor) requests changes, post `/fix`
#    as the owner. Cursor automations ignore reviews and comments from bots
#    (including cursor[bot] and github-actions[bot]), so the Fixer cannot
#    trigger on "changes requested" directly.
# 2. merge — deterministic squash-merge when a PR is BOTH approved by the
#    Cursor reviewer (or the owner) AND all checks are green.
#
# Part of the ways-of-working pipeline (mikekyle/py_projects — WAYS_OF_WORKING.md).
# No LLM, no cost.
#
# Free-plan private repos have no auto-merge feature or branch protection,
# so merge performs a plain squash merge directly.

name: Merge on approval

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: merge-on-approval
  cancel-in-progress: false

jobs:
  request-fix:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request fix
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CURSOR_GITHUB_PAT }}
          AUTHOR: ${{ github.event.review.user.login }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          case "$AUTHOR" in
            cursor|'cursor[bot]'|mikekyle)
              gh pr comment "$PR" --body "/fix"
              ;;
            *)
              echo "Ignoring changes_requested from $AUTHOR"
              ;;
          esac

  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge every open PR that is approved with green checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # A PR qualifies when: not draft, no needs-human label, and among
          # reviews by allowlisted identities the latest per author includes
          # an APPROVED and no outstanding CHANGES_REQUESTED.
          numbers=$(gh pr list --repo "$REPO" --state open \
            --json number,isDraft,labels,latestReviews | jq -r '
            .[]
            | select(.isDraft | not)
            | select(([.labels[].name] | index("needs-human")) | not)
            | ([.latestReviews[]
                | select(.author.login as $a
                    | ["cursor", "cursor[bot]", "mikekyle"] | index($a))]) as $r
            | select(($r | map(select(.state == "APPROVED"))          | length) > 0)
            | select(($r | map(select(.state == "CHANGES_REQUESTED")) | length) == 0)
            | .number')

          [ -z "$numbers" ] && { echo "No approved PRs to consider."; exit 0; }

          for n in $numbers; do
            # Mechanical gate is traditional CI only. Ignore:
            # - this workflow's own jobs (otherwise we wait on ourselves)
            # - Cursor Automation:* (Reviewer stays "in progress" after it
            #   has already approved; judgment is the review, not that check)
            checks_json=$(gh pr checks "$n" --repo "$REPO" --json name,bucket 2>/dev/null || echo '[]')
            blocking=$(printf '%s' "$checks_json" | jq -r '
              [.[]
                | select(.name != "merge" and .name != "request-fix")
                | select(.name | startswith("Cursor Automation") | not)
                | select(.bucket != "pass" and .bucket != "skipping")
                | "\(.name) (\(.bucket))"]
              | join(", ")')

            if [ -z "$blocking" ]; then
              if gh pr merge "$n" --repo "$REPO" --squash --delete-branch; then
                echo "Merged #$n"
              else
                echo "::warning::Merge failed for #$n"
              fi
            else
              echo "Skipping #$n — blocking checks: ${blocking:-none} (will retry on next check_suite / workflow_dispatch)"
            fi
          done
