name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Request review
        if: always()
        continue-on-error: true
        env:
          # Cursor ignores comments from github-actions[bot]. Post as the owner.
          GH_TOKEN: ${{ secrets.CURSOR_GITHUB_PAT }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body "/review"
